  if(Date.now()<OPEN_AT){f.hidden=true;cd.hidden=false;tag.textContent="Weihnachtskonzert · 2026";
    const z=n=>String(n).padStart(2,"0"),upd=()=>{let t=Math.max(0,OPEN_AT-Date.now());if(!t){clearInterval(tick);showForm();return}
      t=Math.floor(t/1000);document.getElementById("cdD").textContent=Math.floor(t/86400);document.getElementById("cdH").textContent=z(Math.floor(t/3600)%24);
      document.getElementById("cdM").textContent=z(Math.floor(t/60)%60);document.getElementById("cdS").textContent=z(t%60)};
    upd();tick=setInterval(upd,1000);
    let taps=[];document.querySelector("#g .m").addEventListener("click",()=>{const n=Date.now();taps=taps.filter(x=>n-x<2500);taps.push(n);if(taps.length>=5){taps=[];showForm()}});
  }else showForm()}
function showForm(){clearInterval(tick);cd.hidden=true;tag.textContent="Nur für zwei.";f.hidden=false;setTimeout(()=>w.focus(),60)}
(async()=>{
  if(!S){g.classList.add("on");st.textContent="Bitte über https öffnen.";return}
  const raw=ls.get(K);
  if(raw){try{const key=await S.importKey("raw",b64(raw),"AES-GCM",false,["decrypt"]);show(await dec(key));return}catch(e){ls.del(K)}}
  ask();
})();
f.onsubmit=async e=>{e.preventDefault();const word=w.value.toLowerCase().replace(/[\s\-_.]+/g,"");if(!word)return;
  b.disabled=true;st.textContent="Einen Moment …";
  try{
    const base=await S.importKey("raw",new TextEncoder().encode(word),"PBKDF2",false,["deriveKey"]);
    const key=await S.deriveKey({name:"PBKDF2",salt,iterations:IT,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
    const html=await dec(key);
    ls.set(K,tob64(await S.exportKey("raw",key)));
    show(html);
  }catch(err){b.disabled=false;st.textContent="Das war nicht das richtige Wort.";w.value="";
    f.classList.remove("err");void f.offsetWidth;f.classList.add("err");try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(e){}w.focus()}
};
})();
